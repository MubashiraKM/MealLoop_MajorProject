{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Donation Form</title>

  <!-- Keep same styling -->
  <link rel="stylesheet" href="{% static 'accounts/donation_form.css' %}">
</head>

<body>

<div class="container">

  <!-- FORM SECTION -->
  <div class="form-section">

    <h2 class="heading">Food Donation Form</h2>

    <form id="donationForm" method="POST" action="{% url 'submit_donation' %}">
      {% csrf_token %}

      <!-- DONOR DETAILS -->
      <label>Full Name</label>
      <input type="text" id="donorName" name="name" required>

      <label>Contact Number</label>
      <input type="text" id="contact" name="phone" required maxlength="10" placeholder="10-digit phone number">

      <label>Address</label>
      <textarea id="address" name="address" rows="2" required></textarea>

      <!-- FOOD SELECTION -->
      <label>Food Category</label>
      <select id="foodCategory" required>
        <option value="">Select Category</option>
      </select>

      <label>Food Name</label>
      <select id="foodName" required disabled>
        <option value="">Select Food</option>
      </select>

      <label>Quantity</label>
      <input type="number" id="quantity" min="1" required>

      <label>Unit</label>
      <select id="unit" required disabled>
        <option value="">Select Unit</option>
      </select>

      <!-- PICKUP -->
      <label>Pickup Date</label>
      <input type="date" id="pickupDate" required>

      <label>Pickup Time</label>
      <input type="time" id="pickupTime" required step="60">

      <!-- OPTIONAL -->
      <label>Special Instructions (Optional)</label>
      <textarea id="instructions" name="instructions" rows="3"></textarea>

      <label>Pickup / Drop Location</label>
      <input type="text" id="dropLocation" name="drop_location" placeholder="Example: Near Gate 1, Main Road">


      <!-- CONSENT -->
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="foodSafe" name="consent" value="True" required>
          I confirm the food is safe and hygienically prepared.
        </label>
      </div>

      <!-- Hidden fields -->
      <input type="hidden" name="food_type" id="hiddenFoodCategory">
      <input type="hidden" name="item_name" id="hiddenFoodName">
      <input type="hidden" name="quantity_val" id="hiddenQuantity">
      <input type="hidden" name="pickup_datetime" id="hiddenPickup">

      <button type="submit">Donate Food</button>

    </form>
  </div>

  <!-- IMAGE SECTION -->
  <div class="image-section">
    <img src="{% static 'accounts/food_donation_img2.jpg' %}" alt="Food Donation">
  </div>

</div>

<script>
  const FOOD_JSON_PATH = "{% static 'accounts/food_data.json' %}";
</script>
<script src="{% static 'accounts/donation_validation.js' %}"></script>

</body>
</html>
